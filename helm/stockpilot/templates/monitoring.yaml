{{- $hasOperator := .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- $backend := include "stockpilot.backend.fullname" . }}
{{- if and .Values.monitoring.serviceMonitor.enabled $hasOperator }}
# Tells the Prometheus Operator to scrape the backend Service's /metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $backend }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- if and .Values.monitoring.prometheusRules.enabled $hasOperator }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $backend }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: stockpilot.rules
      rules:
        - alert: StockPilotBackendDown
          expr: absent(up{job="{{ $backend }}"} == 1)
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No healthy StockPilot backend target is being scraped.
        - alert: StockPilotHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="{{ $backend }}", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{job="{{ $backend }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of API requests are failing with 5xx.
        - alert: StockPilotSlowResponses
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="{{ $backend }}"}[5m]))) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 95th percentile API latency is above 500ms.
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
---
# Discovered by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-dashboard
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  stockpilot.json: |-
    {{- .Files.Get "dashboards/stockpilot.json" | nindent 4 }}
{{- end }}
