# EKS overlay for k8s/traefik-values.yaml: two replicas behind an internet-facing
# Network Load Balancer placed in the public subnets Terraform tagged kubernetes.io/role/elb.
deployment:
  replicas: 2

service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
