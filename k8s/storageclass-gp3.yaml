# EKS only: gp3 EBS volumes via the aws-ebs-csi-driver add-on (installed by Terraform).
# New EKS clusters have no default StorageClass, so PostgreSQL's PVC would stay Pending without this.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
