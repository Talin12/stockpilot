# StockPilot delivery pipeline
#
#   backend-tests ─┐
#   frontend-build ├─> build-scan-push (backend, frontend) ──> deploy (EKS via Helm)
#   infra-lint ────┘         docker build → Trivy gate → GHCR push (tag = commit SHA)
#
# Every third-party action is pinned to a full commit SHA. Tags are mutable: in March 2026
# the trivy-action tags were repointed at credential-stealing code (CVE-2026-33634).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  TRIVY_VERSION: v0.75.0
  HELM_VERSION: v4.3.0

jobs:
  # ---------------------------------------------------------------- quality gates
  backend-tests:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests (pytest) — a failure here stops the pipeline
        run: pytest -v --cov --cov-report=term-missing --cov-fail-under=85 --junitxml=pytest-report.xml
      - name: Publish test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          suite = ET.parse("pytest-report.xml").getroot().find("testsuite")
          a = suite.attrib
          print("### Backend tests")
          print(f"| tests | failures | errors | skipped | time |\n|---|---|---|---|---|")
          print(f"| {a['tests']} | {a['failures']} | {a['errors']} | {a['skipped']} | {float(a['time']):.2f}s |")
          EOF

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  infra-lint:
    name: Terraform + Helm · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt / init / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint / template
        run: |
          helm lint helm/stockpilot -f helm/stockpilot/values-prod.yaml
          helm template stockpilot helm/stockpilot -f helm/stockpilot/values-prod.yaml > /dev/null

  # ---------------------------------------------------------------- build → scan → push
  build-scan-push:
    name: Image · ${{ matrix.component }}
    needs: [backend-tests, frontend-build, infra-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name (GHCR requires lowercase)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/stockpilot-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image ${{ env.IMAGE }}:${{ github.sha }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy scan — fail on fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-${{ matrix.component }}.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Show Trivy report
        if: always()
        run: |
          report="trivy-${{ matrix.component }}.txt"
          [ -f "$report" ] || exit 0
          cat "$report"
          {
            echo "### Trivy · ${{ matrix.component }} (HIGH,CRITICAL, fixable only)"
            if grep -q "Total: [1-9]" "$report"; then echo ":x: vulnerabilities found"; else echo ":white_check_mark: no fixable HIGH/CRITICAL vulnerabilities"; fi
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ env.IMAGE }}:${{ github.sha }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "Pushed \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- deploy
  # Enabled once the EKS cluster exists: set repository variable DEPLOY_ENABLED=true
  # plus secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (see docs/RUNBOOK.md).
  deploy:
    name: Deploy · EKS (Helm)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'stockpilot-eks' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm upgrade --install (image tag = ${{ github.sha }})
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install stockpilot ./helm/stockpilot \
            --namespace stockpilot --create-namespace \
            -f helm/stockpilot/values-prod.yaml \
            --set backend.image.repository="ghcr.io/${owner}/stockpilot-backend" \
            --set frontend.image.repository="ghcr.io/${owner}/stockpilot-frontend" \
            --set backend.image.tag="${GITHUB_SHA}" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            ${{ vars.INGRESS_HOST && format('--set ingress.host={0}', vars.INGRESS_HOST) || '' }} \
            --rollback-on-failure --wait --timeout 10m

      - name: Verify rollout
        run: |
          kubectl -n stockpilot rollout status deploy/stockpilot-backend --timeout=180s
          kubectl -n stockpilot rollout status deploy/stockpilot-frontend --timeout=180s
          kubectl -n stockpilot get pods,svc,ingress,hpa -o wide
          helm -n stockpilot history stockpilot --max 5
